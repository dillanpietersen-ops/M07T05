{% extends "base.html" %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html>
    <body>
        <div class="container">
            <div class="card">
                <h2>Users</h2>
                <div>
                <ul>
                {% for user in users %}
                    <li>{{ user.username }}</li>
                {% endfor %}
                </ul>
            </div>
            <div>
                <form method="POST"
                        action="{% url 'grabsomore:logout' %}"
                        style="margin-top:15px;">
                        {% csrf_token %}
                        <button type="submit"
                                class="btn btn-danger">
                            Logout
                        </button>
                </form>
            </div>
        </div>
                <div>
            <a href="{% url 'eCommerce:admin_dashboard' %}">
                Back to Dashboard
            </a>
        </div>
    </body>
</html>
{% endblock %}
