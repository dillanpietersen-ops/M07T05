{% extends "base.html" %}
{% load static %}
{% block content %}
<h2>Delete Store</h2>
<p>
    Are you sure you want to delete
    <strong>{{ store.name }}</strong>?
</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">
        Yes, Delete Store
    </button>
    <a href="{% url 'eCommerce:store_list' %}">
        Cancel
    </a>
</form>
{% endblock %}
