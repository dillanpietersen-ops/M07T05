{% extends "base.html" %}
{% load static %}

{% block content %}
<h2>Delete Product</h2>
<p>
    Are you sure you want to delete
    <strong>{{ product.name }}</strong>?
</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">
        Yes, Delete Product
    </button>
    <a href="{% url 'eCommerce:vendor_products' %}">
        Cancel
    </a>
</form>
{% endblock %}
