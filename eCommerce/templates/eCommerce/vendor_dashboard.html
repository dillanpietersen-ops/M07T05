{% extends "base.html" %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>🛒 Vendor Dashboard</title>
            <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body>
        <div class="row">
            <div class="col-md-3">
                <a href="{% url 'eCommerce:create_store' %}">
                Create Store </a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'eCommerce:store_list' %}">
                View My Stores
                </a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'eCommerce:create_product' %}">
                Create Product
                </a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'eCommerce:vendor_products' %}">
                Manage Products
                </a>
            </div>
        </div>
        <div>
            <form method="POST"
                action="{% url 'grabsomore:logout' %}"
                style="margin-top:15px;">
                {% csrf_token %}
                <button type="submit"
                    class="btn btn-danger">Logout
                </button>
            </form>
        </div>
    </body>
</html>
{% endblock %}
