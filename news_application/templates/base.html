{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}NewsHub{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'news/css/style.css' %}">
        {% if user.is_authenticated %}
        <form action="{% url 'news:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
        {% endif %}
    
</head>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a href="{% url 'news:dashboard' %}">
            NewsHub
        </a>

        <ul class="navbar-nav ms-auto">

            <li class="nav-item me-3">
                <a href="{% url 'news:dashboard' %}">
                    Home
                </a>
            </li>

            <li class="nav-item me-3">
                <a href="{% url 'news:article-list' %}">
                    Articles
                </a>
            </li>

            <li class="nav-item me-3">
                <a href="{% url 'news:newsletter-list' %}">
                    Newsletters
                </a>
            </li>

        </ul>

    </div>
</nav>

<main class="container py-4">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/.3/dist/js/bootstrap.bundle.min.jsscript>


{% block scripts %}
{% endblock %}

</body>
</html>
