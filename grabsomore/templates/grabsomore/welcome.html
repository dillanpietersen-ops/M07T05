{% extends "base.html" %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html>
    <body>
        <div>
            <h1>Welcome {{ request.user.username }}</h1>
            <p>Your online shopping experience starts here.</p>
        </div>
        <div class="container">
            <div class="card">
                <h2>Account Dashboard</h2>
                <p>You are successfully logged in.</p>
                <br>
                <a href="{% url 'eCommerce:products_list' %}"
                class="btn btn-primary">View Products
                </a>
                <form method="POST"
                    action="{% url 'grabsomore:logout' %}"
                    style="margin-top:15px;">
                    {% csrf_token %}
                    <button type="submit"
                            class="btn btn-danger">Logout
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
 {% endblock %}
